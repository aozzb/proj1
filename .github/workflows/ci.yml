name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: webhook_db
          POSTGRES_USER: webhook_user
          POSTGRES_PASSWORD: testpass
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U webhook_user -d webhook_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Test connection config (matches tests/testEnv.ts fallbacks).
      POSTGRES_PASSWORD: testpass
      TEST_DATABASE_URL: postgres://webhook_user:testpass@localhost:5433/webhook_test
      TEST_ADMIN_DATABASE_URL: postgres://webhook_user:testpass@localhost:5433/webhook_db
      TEST_REDIS_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm run build
      - run: npm test
