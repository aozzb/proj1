
services:
  api:
    build:
      context: .
      target: dev
    container_name: webhook-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: debug
      DATABASE_URL: postgres://webhook_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/webhook_db
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Hot reload: mount source, but keep the image's node_modules.
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      - /app/node_modules

  worker:
    build:
      context: .
      target: dev
    container_name: webhook-worker
    restart: unless-stopped
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      DATABASE_URL: postgres://webhook_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/webhook_db
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./tsconfig.json:/app/tsconfig.json
      - /app/node_modules
    command: ["npm", "run", "worker"]

  chaos-receiver:
    build:
      context: .
      target: dev
    container_name: webhook-chaos
    restart: unless-stopped
    environment:
      CHAOS_PORT: 4000
      CHAOS_FAIL_RATE: ${CHAOS_FAIL_RATE:-0.4}
      CHAOS_HANG_RATE: ${CHAOS_HANG_RATE:-0.2}
      CHAOS_HANG_MS: ${CHAOS_HANG_MS:-20000}
      # Test overrides (empty/0 by default = random chaos). Recreate with e.g.
      #   CHAOS_FORCE_STATUS=200 CHAOS_SECRET=<secret> docker compose up -d chaos-receiver
      CHAOS_FORCE_STATUS: ${CHAOS_FORCE_STATUS:-}
      CHAOS_SUCCEED_AFTER: ${CHAOS_SUCCEED_AFTER:-0}
      CHAOS_SECRET: ${CHAOS_SECRET:-}
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./src:/app/src
      - ./tsconfig.json:/app/tsconfig.json
      - /app/node_modules
    command: ["npm", "run", "chaos"]

  # One-off runner: `docker compose run --rm migrate`
  migrate:
    build:
      context: .
      target: dev
    environment:
      DATABASE_URL: postgres://webhook_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/webhook_db
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/app/migrations
    command: ["npm", "run", "migrate", "up"]
    profiles: ["tools"]

  postgres:
    image: postgres:17
    container_name: webhook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: webhook_db
      POSTGRES_USER: webhook_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook_user -d webhook_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    container_name: webhook-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
